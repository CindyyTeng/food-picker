<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大寶貝温温選想吃的-優化版</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script type="text/javascript">
   (function(){
      // ⚠️ 請換成你的 Public Key
      emailjs.init("UyytpZs1nmmt_dav0"); 
   })();
</script>
    <style>
        :root {
            --primary: #ff4757;
            --bg: #121212;
            --card: #1e1e1e;
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .title {
            color: white;
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* 遊戲介面 */
        .game-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .choice-box {
            width: 100%;
            height: 200px;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            border: 3px solid #333;
            transition: 0.3s;
            background: #000;
        }

        .choice-box:hover {
            border-color: var(--primary);
            transform: scale(1.02);
        }

        .choice-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 關鍵：改成 contain 確保不裁切 */
        .choice-label {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            font-size: 1.2rem;
        }

        /* 管理介面 (縮排清單) */
        #admin {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
            text-align: left;
        }

        .outline-item {
            margin-left: 20px;
            border-left: 1px solid #444;
            padding: 5px 0 5px 15px;
            position: relative;
        }

        .item-card {
            background: var(--card);
            padding: 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .item-card img {
            width: 45px;
            height: 45px;
            border-radius: 5px;
            object-fit: cover;
            cursor: pointer;
            border: 1px solid #555;
        }

        .item-card input {
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            padding: 5px;
            border-radius: 4px;
            flex-grow: 1;
        }

        .btn-sm {
            font-size: 0.8rem;
            padding: 6px 10px;
            cursor: pointer;
            background: #444;
            color: #fff;
            border: none;
            border-radius: 4px;
        }

        .btn-add {
            background: #2ed573;
            font-weight: bold;
        }

        .btn-del {
            background: #ff4757;
        }

        .btn-save {
            position: sticky;
            bottom: 20px;
            width: 100%;
            padding: 15px;
            background: var(--primary);
            font-weight: bold;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            margin-top: 20px;
        }

        #result-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            padding: 40px 20px;
        }

        .loading {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .badge {
            font-size: 0.7rem;
            background: #555;
            padding: 2px 5px;
            border-radius: 3px;
            color: #ccc;
        }
    </style>
</head>

<body>

    <div id="loader" class="loading">
        <div
            style="border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite;">
        </div>
        <p>圖片壓縮上傳中...</p>
    </div>

    <div id="game-ui">
        <div class="title">2/14情人節~我們家温温想吃~</div>
        <div class="game-container" id="choices-area"></div>
        <div style="margin-top: 30px;">
            <button class="btn-sm" onclick="resetGame()">↩ 重頭開始</button>
            <button class="btn-sm" onclick="openAdmin()" style="margin-left:10px; background: #555;">⚙️ 設定</button>
        </div>
    </div>

    <div id="result-overlay">
        <h2 style="color:white">最後決定~嘟逼嘟逼嘟：</h2>
        <h4 style="color:white;">你想吃的你的大寶寶帶你去吃 都給你吃!啾啾啾</h4>
        <img id="res-img"
            style="width:100%; max-height:50vh; border-radius:15px; object-fit: cover; margin: 20px 0; object-fit: contain;">
        <h1 id="res-name"></h1>
        <button class="btn-save" style="position:static" onclick="location.reload()">首頁</button>
    </div>

    <div id="admin">
        <h2>🌲 設定選項路徑</h2>
        <p style="font-size:0.8rem; color:#aaa; margin-bottom: 20px;">
            💡 提示：點擊「+」會自動建立一組對決，其中一個會繼承父項。點擊小圖示可換圖。
        </p>
        <div id="outline-root">
            <div style="margin-bottom: 15px; display: flex; gap: 10px;">
                <button class="btn-add" onclick="addNewItem(0)">+ 新增第一關</button>
                <button class="btn-sm" style="background: #eb4d4b;" onclick="resetAll()">🗑️ 清空</button>
            </div>
            <div id="tree-container" style="margin-top: 15px;"></div>
        </div>
        <button class="btn-save" onclick="saveToCloud()">💾 儲存所有變更並同步雲端</button>
        <button class="btn-sm" style="width:100%; margin-top:10px; background:#333;"
            onclick="location.reload()">取消並返回</button>
    </div>

    <script>
        // --- 🔑 請在此填入你的 Supabase 資訊 ---
        const SB_URL = "https://zmgpnqluwxwkntdrwieg.supabase.co";
        const SB_KEY = "sb_publishable_z_i1UJ15EOU6z7_Bv3dAvg_lWoG3UA7";
        const client = supabase.createClient(SB_URL, SB_KEY);

        let allData = [];
        let currentParentId = 0;

        async function init() {
            const { data } = await client.from('restaurants').select('*');
            allData = data || [];
            renderGame();
        }

        // --- 遊戲邏輯 ---
        function renderGame() {
            const choices = allData.filter(item => item.parent_id == currentParentId);
            const area = document.getElementById('choices-area');
            area.innerHTML = '';

            if (choices.length === 0) {
                area.innerHTML = '<p style="color:#666">目前沒有資料，請點擊下方設定按鈕</p>';
                return;
            }

            choices.forEach(item => {
                const div = document.createElement('div');
                div.className = 'choice-box';
                div.onclick = () => handleChoice(item);
                div.innerHTML = `<img src="${item.image_url}"><div class="choice-label">${item.name}</div>`;
                area.appendChild(div);
            });
        }

        function handleChoice(selected) {
            const children = allData.filter(item => item.parent_id == selected.id);
            if (children.length > 0) {
                currentParentId = selected.id;
                renderGame();
            } else {
                showResult(selected);
            }
        }

        async function showResult(item) {
    // 1. 顯示 UI 結果畫面
    document.getElementById('res-img').src = item.image_url;
    document.getElementById('res-name').innerText = item.name;
    document.getElementById('result-overlay').style.display = 'block';

    // 2. 準備信件內容
    const timeStr = getTaiwanTime();
    const emailParams = {
        food_name: item.name, // 對應 Template 裡的 {{food_name}}
        time: timeStr         // 對應 Template 裡的 {{time}}
    };

    // 3. 執行寄信
    // ⚠️ 請填入你的 SERVICE_ID 和 TEMPLATE_ID
    emailjs.send("service_wba9z4d", "template_vy2fwkd", emailParams)
        .then(() => {
            console.log("✅ 通知信件已成功寄出！");
        })
        .catch((err) => {
            console.error("❌ 寄信失敗，錯誤資訊：", err);
        });
}
        function resetGame() {
            currentParentId = 0;
            renderGame();
        }

        // --- 管理邏輯 ---

        //清空全部
        function resetAll() {
            if (confirm("⚠️ 確定要清空所有設定嗎？")) {
                //1. 直接清空所有資料陣列
                allData = [];

                //2. 重新渲染前端畫面(這時樹狀圖會變空)
                renderTree();

                //3. 延遲執行alert，讓畫面先動
                setTimeout(() => {
                    alert("已清空暫存");
                }, 50); //讓alert延遲 50 毫秒
            }
        }

        function openAdmin() {
            document.getElementById('admin').style.display = 'block';
            renderTree();
        }

        function renderTree(pid = 0, container = null) {
            if (!container) {
                container = document.getElementById('tree-container');
                container.innerHTML = '';
            }

            const children = allData.filter(d => d.parent_id == pid);
            children.forEach(item => {
                const wrapper = document.createElement('div');
                wrapper.className = 'outline-item';
                wrapper.innerHTML = `
                <div class="item-card">
                    <img src="${item.image_url}" onclick="changeImg(${item.id})" title="點擊更換照片">
                    <input type="text" value="${item.name}" onchange="updateName(${item.id}, this.value)">
                    <button class="btn-add btn-sm" onclick="addNewItem(${item.id})" title="新增下一題對手">+</button>
                    <button class="btn-del btn-sm" onclick="deleteItem(${item.id})">×</button>
                </div>
                <div id="child-of-${item.id}"></div>
            `;
                container.appendChild(wrapper);
                renderTree(item.id, document.getElementById(`child-of-${item.id}`));
            });
        }

        //強制計算台灣時間的函數
        function getTaiwanTime() {
            const now = new Date();
            //加上8小時的毫秒數
            const offset = 8 * 60 * 60 * 1000;
            const twTime = new Date(now.getTime() + offset);

            // 手動組裝成 YYYY-MM-DD HH:mm:ss 格式
            const yyyy = twTime.getUTCFullYear();
            const mm = String(twTime.getUTCMonth() + 1).padStart(2, '0');
            const dd = String(twTime.getUTCDate()).padStart(2, '0');
            const hh = String(twTime.getUTCHours()).padStart(2, '0');
            const min = String(twTime.getUTCMinutes()).padStart(2, '0');
            const ss = String(twTime.getUTCSeconds()).padStart(2, '0');

            return `${yyyy}-${mm}-${dd} ${hh}:${min}:${ss}`;
        }

        // 邏輯優化：點擊 + 自動生兩個 (一個繼承，一個空白)
        function addNewItem(pid) {
            const parent = allData.find(d => d.id == pid);
            const now = Date.now();
            const currentTime = getTaiwanTime(); //取得當下台灣時區的時間

            if (pid !== 0 && parent) {
                // 子關卡：自動產生一組對決
                allData.push({
                    id: now,
                    name: parent.name,
                    image_url: parent.image_url,
                    parent_id: pid,
                    created_at: currentTime
                });
                allData.push({
                    id: now + 1,
                    name: "新選項",
                    image_url: "https://via.placeholder.com/400x200?text=New+Choice",
                    parent_id: pid,
                    created_at: currentTime
                });
            } else {
                // 第一關：單個新增
                allData.push({
                    id: now,
                    name: "新起始選項",
                    image_url: "https://via.placeholder.com/400x200?text=Start+Choice",
                    parent_id: 0,
                    created_at: currentTime
                });
            }
            renderTree();
        }

        function updateName(id, val) {
            const item = allData.find(d => d.id == id);
            if (item) item.name = val;
        }

        function deleteItem(id) {
            if (confirm("確定刪除嗎？這將會連同它下面的所有分支一起刪除。")) {
                const toDelete = [id];
                const findChildren = (pid) => {
                    allData.filter(d => d.parent_id == pid).forEach(c => {
                        toDelete.push(c.id);
                        findChildren(c.id);
                    });
                };
                findChildren(id);
                allData = allData.filter(d => !toDelete.includes(d.id));
                renderTree();
            }
        }

        // 效能優化：圖片自動壓縮
        async function changeImg(id) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                document.getElementById('loader').style.display = 'flex';

                const compressedUrl = await compressAndUpload(file);
                if (compressedUrl) {
                    const item = allData.find(d => d.id == id);
                    item.image_url = compressedUrl;
                    renderTree();
                } else {
                    alert("上傳失敗，請再試一次");
                }
                document.getElementById('loader').style.display = 'none';
            };
            input.click();
        }

        async function compressAndUpload(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob(async (blob) => {
                            const fileName = `tree_${Date.now()}.jpg`;
                            const { data, error } = await client.storage.from('food-images').upload(fileName, blob);
                            if (error) { resolve(null); }
                            else {
                                const url = `${SB_URL}/storage/v1/object/public/food-images/${fileName}`;
                                resolve(url);
                            }
                        }, 'image/jpeg', 0.7); // 壓縮品質設為 0.7
                    };
                };
            });
        }

        async function saveToCloud() {
            document.getElementById('loader').style.display = 'flex';
            // 採刪除舊有資料再插入新資料的方式同步
            try {
                await client.from('restaurants').delete().neq('id', 0);
                const { error } = await client.from('restaurants').insert(allData);
                if (!error) {
                    alert("🎉 雲端魔樹同步成功！");
                    location.reload();
                } else {
                    alert("儲存出錯：" + error.message);
                }
            } catch (e) {
                alert("系統錯誤：" + e.message);
            }

            document.getElementById('loader').style.display = 'none';
        }

        //啟動程式
        init();
    </script>
</body>

</html>
